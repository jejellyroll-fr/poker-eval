name: macOS arm64

# The hosted macOS arm64 pool regularly stops serving this repository: a job
# that never gets a runner is cancelled after about 15 minutes with "The job
# was not acquired by Runner of type hosted even after multiple attempts", no
# step runs, and the run is reported as failed. `continue-on-error` cannot help
# (it downgrades `failure`, not a cancellation) and neither can `timeout-minutes`
# (the budget only applies once a runner picked the job up), so keeping these
# legs inside CMake Build, CI Pipeline and Release Build Check made every pull
# request red without testing anything.
#
# They live here instead, on a deterministic rule:
#
#   push, schedule, workflow_dispatch  -> always run (master/development and the
#                                        nightly build keep their arm64 coverage),
#                                        except a push that touches only Markdown
#                                        files or docs/ on master/development
#   pull_request                       -> run only with the `macos-arm64` label
#
# Add the label to a pull request when the arm64 legs are worth the wait, and
# remove it when the pool is starving; nothing here guesses the pool's state.
# The jobs are not part of the required checks on master, so a pull request
# without the label stays green.

on:
  push:
    branches: [ master, development ]
    # A documentation-only push gives the arm64 legs nothing to build and costs
    # a hosted arm64 slot, so it is skipped. The filter applies to `push` only:
    # on a pull request the label stays the single opt-in, and a Markdown change
    # under a pull request that also touches code still runs the legs.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ master, development ]
    # Adding or removing the label must (re)start the legs; the default types
    # would leave a labelled pull request without an arm64 run until its next
    # push.
    types: [ opened, reopened, synchronize, labeled, unlabeled ]
  schedule:
    # Nightly, off the hour to avoid the scheduled-workflow rush.
    - cron: '41 4 * * *'
  workflow_dispatch:

concurrency:
  # Two pushes to the same ref supersede each other: a stale run must not hold
  # the scarce arm64 pool while a newer commit waits behind it. A re-run must
  # never do that, and scoping by `event_name` alone does not separate the two:
  # a re-run keeps `github.event_name == 'push'`, so `gh run rerun` of an older
  # commit joined the same group and cancelled the push that was building (run
  # 44473395372 killed 44474725243 on 2026-11-19).
  #
  # `github.run_attempt` is 1 for every fresh run and 2 and up for a re-run, so
  # a first attempt keeps the ref in the group and still supersedes the
  # previous push, while a re-run joins a group named after its own run id and
  # can neither cancel nor be cancelled.
  group: "macos-arm64-${{ github.event_name }}-${{ github.run_attempt == 1 && github.ref || github.run_id }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CMake Release (arm64)
    # Every event except `pull_request` runs the legs; a pull request opts in
    # with the `macos-arm64` label.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'macos-arm64')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: brew install ninja

    - name: Configure CMake
      run: cmake --preset macos

    # Capped like the native-test leg: an unbounded --parallel exhausts the
    # process limit of the small arm64 runners.
    - name: Build
      run: cmake --build --preset macos --parallel 2

    - name: Test
      run: ctest --preset macos --output-on-failure --timeout 60

  native-tests:
    name: Native Tests (arm64)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'macos-arm64')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
    - uses: actions/checkout@v5

    - name: Configure native test build
      run: |
        cmake -S . -B build-native \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF \
          -DENABLE_NATIVE_ARCH=OFF

    - name: Build native test build
      run: cmake --build build-native

    # 376 independent cases, of which one alone
    # (`pe_preflop_tree_flop_resolves_with_mpf`) accounts for about half of the
    # wall time: run one at a time they cost the job fifteen to seventeen
    # minutes, which is nearly all of its duration. ctest schedules them across
    # the available cores and still honours `DEPENDS`, which the preflop pair
    # uses for its shared tree file. The `slow`-tagged cases are dropped on pull
    # requests by the command below.
    # A pull request does not pay for the cases tagged `slow`: the longest of
    # them (`pe_preflop_tree_flop_resolves_with_mpf`, about 526 s) alone triples
    # the suite, and the Linux legs run it on every pull request anyway. Pushes
    # and the nightly keep the full suite, so the arm64 leg still covers it once
    # a change lands.
    # The one failure still unexplained is a runner that stops making progress:
    # run 44828726427 lost 66 s and 74 s that way, and its log records the gap
    # without its cause. On the nightly and on a manual dispatch, the load
    # average, `vm_stat` and the busiest processes are printed every two seconds
    # while the suite runs, so the next stall arrives with the system figures it
    # happened under.
    #
    # They go to this step's own output rather than to a file uploaded by a
    # later step: a job that reaches its 45-minute limit runs no further step,
    # artifact upload included, while the output already written is kept. And
    # the sampler runs here rather than in a step of its own because the runner
    # only documents a cleanup at the end of the job, where it kills whatever
    # still carries the job tracking id; nothing says a process started in an
    # earlier step is alive in this one. The EXIT trap stops the loop however
    # ctest ends.
    - name: Run native test suite
      run: |
        # Constant, not `getconf _NPROCESSORS_ONLN`: the cores a runner reports
        # are not a safe degree of parallelism. Measured on the 3-core runner
        # in Debug with OpenMP on, --parallel 3 ran all 390 cases in 764.46 s
        # (run 44888589983) while --parallel 12 inflated the CPU-bound cases
        # about five times and pushed test_cfr_chance_nodes, test_mpf_hilo8 and
        # test_pe_hand_features into timeout (run 44891011141). Four keeps one
        # case per core plus one.
        # The two timeouts of run 44828726427 are not a counter-example: they
        # fall in windows where that runner made no progress at all, whatever
        # the degree of parallelism. See docs/ci.md.
        parallel=4
        if [ "${{ github.event_name }}" = "schedule" ] ||
           [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          (
            # A failing `vm_stat` or `ps` must not end the loop: the shell runs
            # with `-e`, and a sampler that died early would read as a quiet
            # suite.
            set +e
            while :; do
              echo "== $(date -u +%H:%M:%S)"
              sysctl -n vm.loadavg
              vm_stat | head -8
              ps -Ao pid,pcpu,stat,comm -r | head -5
              sleep 2
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          ctest --test-dir build-native --output-on-failure --timeout 300 \
            --parallel "$parallel" -LE slow
        else
          ctest --test-dir build-native --output-on-failure --timeout 300 \
            --parallel "$parallel"
        fi

  wheels:
    name: Wheel (arm64)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'macos-arm64')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5

    - name: Build wheel via cibuildwheel
      uses: pypa/cibuildwheel@fa04202e88ea28b84d5d4d20696ee8dfc0119436 # v2.23.0
      env:
        CIBW_BUILD: "cp311-*"
        CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
        # Same exercise as release-check.yml: the installed wheel, not the tree.
        CIBW_TEST_COMMAND: "python {project}/tests/test_python_rng_seed.py && python {project}/tests/test_python_draw_games.py"
