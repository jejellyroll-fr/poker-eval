name: macOS arm64 capacity re-run

# The hosted Apple Silicon pool sometimes refuses to hand out a runner: every
# job is cancelled roughly twenty minutes after it is queued, not a single step
# executes, and the run concludes `failure` with the annotation "The job was not
# acquired by Runner of type hosted even after multiple attempts". Nothing was
# built or tested, so that run says nothing about its commit and used to cost a
# manual `gh run rerun`. See docs/ci.md.
#
# This watcher inspects every completed run of `macOS arm64` and re-runs the ones
# where at least one job never obtained a runner:
#
#   a job has no steps and was not skipped  -> the pool never served that job,
#                                              so the run tested nothing at all
#                                              or only part of the matrix -> re-run
#   every job that ran executed a step      -> a real failure           -> leave it alone
#   run concluded `cancelled`               -> the concurrency group replaced
#                                              it with a newer run      -> leave it alone
#
# The partial case is the one that used to slip through: if `Wheel` happens to get
# the single arm64 runner the pool hands out while `CMake Release` and `Native
# Tests` starve, the run has steps in it and a plain "did anything run?" check
# sees a real failure where the pool actually failed the run (run 44497002211).
# Counting jobs with an empty step list catches both the whole-run outage and
# that mixed case; a job skipped by an `if` also has no steps, which is why the
# count excludes `skipped` jobs.
#
# Only the first attempt is retried, so a starved pool ends red instead of
# looping; the retry lands in its own concurrency group (see the group note in
# macos-arm64.yml) and cancels nothing.

on:
  workflow_run:
    workflows: ["macOS arm64"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'macOS arm64 run id to inspect'
        required: true
      rerun:
        description: 'Re-run it when a job never obtained a runner (otherwise only report)'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: macos-arm64-capacity-rerun-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Re-run a run the pool never started
    # A successful or cancelled run needs no inspection, so gate the job itself:
    # no runner is requested at all for those completions. The manual entry
    # point always runs, so it can report on any run id.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Inspect the completed run
      id: inspect
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        INPUT_RUN_ID: ${{ inputs.run_id }}
      run: |
        set -euo pipefail
        run_id="${EVENT_RUN_ID:-$INPUT_RUN_ID}"
        echo "run=$run_id" >> "$GITHUB_OUTPUT"

        attempt=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .run_attempt)
        conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .conclusion)
        jobs=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs" --paginate \
          --jq '.jobs | length')
        # A job the pool never served has an empty step list. A job skipped by an
        # `if` has one too, so `skipped` jobs are excluded: they say nothing about
        # runner capacity.
        starved=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs" --paginate \
          --jq '[.jobs[] | select((.steps | length) == 0 and .conclusion != "skipped")] | length')
        starved_names=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs" --paginate \
          --jq '[.jobs[] | select((.steps | length) == 0 and .conclusion != "skipped") | .name] | join(", ")')

        echo "attempt=$attempt conclusion=$conclusion jobs=$jobs starved=$starved"
        if [ -n "$starved_names" ]; then
          echo "jobs that never got a runner: $starved_names"
        fi

        idle=false
        if [ "$conclusion" = "failure" ] && [ "$jobs" -gt 0 ] && [ "$starved" -gt 0 ]; then
          idle=true
        fi
        echo "idle=$idle" >> "$GITHUB_OUTPUT"
        echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

        if [ "$idle" = true ]; then
          echo "$starved of $jobs job(s) never obtained a runner: the pool starved this run."
        else
          echo "Nothing to do: every job that was not skipped ran a step, or the run was cancelled."
        fi

    # `workflow_run` carries the attempt number of the run that just finished;
    # a re-run reports attempt 2 and up, which is what stops the loop.
    - name: Re-run it once
      if: >-
        steps.inspect.outputs.idle == 'true' &&
        (inputs.rerun == true || github.event.workflow_run.run_attempt == 1)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh api -X POST "repos/$GH_REPO/actions/runs/${{ steps.inspect.outputs.run }}/rerun"
        echo "Re-run requested for run ${{ steps.inspect.outputs.run }}."
