name: Install Test (Matrix)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  install-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -S . -B build \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BINDINGS=OFF \
            -DBUILD_GPU=OFF \
            -DENABLE_OPENMP=OFF

      - name: Build
        run: cmake --build build -j

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/pokereval"

      # BUILD_SHARED_LIBS defaults to ON, so this job must produce shared
      # libraries. Without this check it installed the same archives as the
      # static job and the two were indistinguishable.
      - name: Check the installed artifacts are shared libraries
        run: |
          shared=$(find "$RUNNER_TEMP/pokereval/lib" -maxdepth 1 \( -name '*.so*' -o -name '*.dylib' \) | wc -l)
          archives=$(find "$RUNNER_TEMP/pokereval/lib" -maxdepth 1 -name '*.a' | wc -l)
          echo "shared=$shared archives=$archives"
          test "$shared" -gt 0
          test "$archives" -eq 0

      - name: Configure consumer (find_package)
        run: |
          cmake -S ci/install_check -B ci/build \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/pokereval"

      - name: Build consumer
        run: cmake --build ci/build -j

      - name: Run consumer
        run: |
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/pokereval/lib:$DYLD_LIBRARY_PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/pokereval/lib:$LD_LIBRARY_PATH"
          ./ci/build/install_check

  # The matrix above builds with ENABLE_OPENMP=OFF, so it never exercises the
  # exported targets that reference OpenMP::OpenMP_C. Consuming an OpenMP build
  # is what caught the missing find_dependency(OpenMP) in the package config.
  install-test-openmp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -S . -B build \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BINDINGS=OFF \
            -DBUILD_GPU=OFF \
            -DENABLE_OPENMP=ON

      - name: Verify OpenMP was actually enabled
        run: grep -q "POKER_EVAL_WITH_OPENMP ON" build/poker-eval-config.cmake

      - name: Build
        run: cmake --build build -j

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/pokereval"

      - name: Configure consumer (find_package)
        run: |
          cmake -S ci/install_check -B ci/build \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/pokereval"

      - name: Build consumer
        run: cmake --build ci/build -j

      - name: Run consumer
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/pokereval/lib:$LD_LIBRARY_PATH"
          ./ci/build/install_check
