name: GPU Build

on:
  push:
    branches:
      - master
  pull_request:

# BUILD_GPU defaults to ON, yet every other workflow forces it OFF, so the GPU
# sources were never compiled anywhere. This job builds them. It needs no GPU:
# the OpenCL ICD loader and headers are enough to compile and link.
jobs:
  gpu-build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenCL (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner's own sources point at the Azure-local mirror, which is
          # the fast path from a GitHub-hosted runner. An earlier workaround
          # rewrote them to the public archive, sending every fetch over the
          # open internet; a 120 s cap with a single retry then turned a slow
          # mirror into a hard failure, and `|| true` swallowed it so the job
          # died later on a missing header with no trace of the cause. Keep the
          # runner default, let apt retry the download itself, and fail here if
          # the headers cannot be fetched.
          #
          # The mirror is occasionally unresolvable from the runner
          # ("Temporary failure resolving 'azure.archive.ubuntu.com'"); retry
          # the whole install and, after the second failure, point the job at
          # public resolvers before the last attempt.
          set -u
          install_opencl() {
            sudo DEBIAN_FRONTEND=noninteractive apt-get update \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 &&
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends opencl-headers ocl-icd-opencl-dev
          }
          for attempt in 1 2 3; do
            if install_opencl; then exit 0; fi
            echo "apt attempt ${attempt} failed" >&2
            if [ "${attempt}" = 2 ]; then
              echo "apt still failing; using public resolvers" >&2
              printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' |
                sudo tee /etc/resolv.conf >/dev/null
            fi
            sleep 10
          done
          echo "could not install the OpenCL headers" >&2
          exit 1

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BINDINGS=OFF \
            -DBUILD_GPU=ON \
            -DENABLE_OPENMP=OFF 2>&1 | tee configure.log

      # Without this the job would pass while compiling no OpenCL source at all,
      # which is exactly how these files rotted in the first place.
      - name: Verify the OpenCL backend is actually built
        run: grep -q "OpenCL GPU-CFR backend configured" configure.log

      - name: Build
        run: cmake --build build -j

      - name: Check the OpenCL objects were produced
        run: |
          find build -name 'gpu_cfr_opencl.c.o' | grep .
          find build -name 'eval_batched_opencl.c.o' | grep .
