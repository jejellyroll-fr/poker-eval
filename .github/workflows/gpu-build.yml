name: GPU Build

on:
  push:
    branches:
      - master
  pull_request:

# BUILD_GPU defaults to ON, yet every other workflow forces it OFF, so the GPU
# sources were never compiled anywhere. This job builds them. It needs no GPU:
# the OpenCL ICD loader and headers are enough to compile and link.
jobs:
  gpu-build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenCL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends opencl-headers ocl-icd-opencl-dev || true

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BINDINGS=OFF \
            -DBUILD_GPU=ON \
            -DENABLE_OPENMP=OFF 2>&1 | tee configure.log

      # Without this the job would pass while compiling no OpenCL source at all,
      # which is exactly how these files rotted in the first place.
      - name: Verify the OpenCL backend is actually built
        run: grep -q "OpenCL GPU-CFR backend configured" configure.log

      - name: Build
        run: cmake --build build -j

      - name: Check the OpenCL objects were produced
        run: |
          find build -name 'gpu_cfr_opencl.c.o' | grep .
          find build -name 'eval_batched_opencl.c.o' | grep .
