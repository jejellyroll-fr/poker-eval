name: ASan Debug (pineapple simd)

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Non-blocking: this is a debug aid to capture ASan stack traces for the
# pineapple batched-SIMD segfault (PR #96). It must not gate merges.
jobs:
  asan-linux:
    name: ASan Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang libomp-dev
          else
            sudo apt-get install -y gcc g++
          fi

      - name: Disable -Werror and fix missing return for debug build (runner-only)
        run: |
          sed -i 's/-Werror//g' CMakeLists.txt
          # eval_low27.h ends with assert() and no return -> -Werror=return-type in Release
          sed -i 's|  assert(!"Logic error in StdDeck_Lowball27_EVAL_N");|  assert(!"Logic error in StdDeck_Lowball27_EVAL_N");\n  return 0;|' include/poker_eval/games/eval_low27.h

      - name: Configure (ASan + UBSan, Release — matches crashing CI config)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build-asan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -Wno-error" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -Wno-error"

      - name: Build test
        run: cmake --build build-asan --target test_pineapple_batched_unity --parallel

      - name: Run test under ASan
        run: |
          ./build-asan/tests/unity_tests/test_pineapple_batched_unity \
            || true
        continue-on-error: true
