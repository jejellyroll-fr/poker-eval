name: macOS arm64 stall check

# `Native Tests (arm64)` prints `== HH:MM:SS`, the load average, `vm_stat` and
# the busiest processes every two seconds on a nightly or a manual dispatch
# (macos-arm64.yml). A window without a sample is a window in which that
# runner made no progress: run 44828726427 lost 66 s and 74 s that way, and
# ctest charged each of them to the cases it caught (docs/ci.md). Nobody reads
# a nine-thousand-line log looking for that, so this watcher does.
#
# It runs on `ubuntu-latest` and only downloads the log of a run that already
# finished: it never requests an arm64 runner, never touches the run it
# inspects, and fails only when a window over the threshold is found.
#
# A sampler that dies before the suite ends leaves no window behind, only
# silence, so the first and last samples are also checked against the suite
# bounds (its first `Start N:` line and `Total Test time`): samples that do
# not bracket the suite are reported the same way. A log with samples but no
# `Total Test time` is its own signal: the job was stopped at its time limit
# or cancelled, and neither bound would look wrong.
#
# Pull-request runs carry no sample on purpose (the sampler is gated on
# `schedule` and `workflow_dispatch` in macos-arm64.yml), so the job is gated
# on those two events as well. For those two, a log without a single sample is
# a failure: it means the sampler died before writing, which no window would
# ever show. A run of another event inspected by hand is reported and stays
# green, since the sampler never ran there. A run whose native-test job never
# started, or that the pool starved, is reported as having nothing to
# inspect — that case belongs to macos-arm64-capacity-rerun.yml.

on:
  workflow_run:
    workflows: ["macOS arm64"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'macOS arm64 run id to inspect'
        required: true
      threshold:
        description: 'Report windows longer than this many seconds'
        default: '10'

permissions:
  actions: read
  contents: read

concurrency:
  group: arm64-stall-check-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  stalls:
    name: Report VM sampling gaps
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5

    - name: Download the native test log
      id: log
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        INPUT_RUN_ID: ${{ inputs.run_id }}
      run: |
        set -euo pipefail
        run_id="${EVENT_RUN_ID:-$INPUT_RUN_ID}"
        echo "run=$run_id" >> "$GITHUB_OUTPUT"

        selector='[.jobs[] | select(.name == "Native Tests (arm64)")][0]'
        jobs_api="repos/$GH_REPO/actions/runs/$run_id/jobs"
        job_id=$(gh api "$jobs_api" --paginate --jq "$selector.id")
        conclusion=$(gh api "$jobs_api" --paginate --jq "$selector.conclusion")
        # Which event produced the run decides what a log without samples
        # means: the sampler only runs on a schedule or a dispatch.
        event=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .event)
        echo "job=$job_id conclusion=$conclusion event=$event"
        echo "event=$event" >> "$GITHUB_OUTPUT"

        # A job the pool never served has no log, and a skipped one was never
        # meant to run: there is nothing to look at in either case.
        if [ "$job_id" = "null" ]; then
          echo "Nothing to inspect: no native-test job in run $run_id."
          exit 0
        fi
        if [ "$conclusion" != "success" ] &&
           [ "$conclusion" != "failure" ]; then
          echo "Nothing to inspect: the native-test job is $conclusion."
          exit 0
        fi

        # The log carries the escape sequences ctest writes, and gh refuses to
        # write those to stdout without the flag; the first live run of this
        # watcher was green because that refusal was read as an expired log.
        logs="repos/$GH_REPO/actions/jobs/$job_id/logs"
        if ! gh api --allow-escape-sequences "$logs" \
             > native.log 2> gh.err; then
          if grep -qiE '404|410|not found|expired' gh.err; then
            echo "Nothing to inspect: the log of job $job_id has expired."
            exit 0
          fi
          echo "::error::Downloading the log of job $job_id failed:"
          cat gh.err
          exit 1
        fi
        echo "lines=$(wc -l < native.log)"
        echo "inspect=yes" >> "$GITHUB_OUTPUT"

    - name: Report windows over the threshold
      if: steps.log.outputs.inspect == 'yes'
      env:
        EVENT_THRESHOLD: ${{ inputs.threshold }}
        SAMPLER_EVENT: ${{ steps.log.outputs.event }}
      run: |
        threshold="${EVENT_THRESHOLD:-10}"
        # The step runs under `bash -e`, which would abort on the exit status
        # the script uses to say what it found, so it is read before anything
        # decides.
        set +e
        python3 scripts/check_arm64_vm_stalls.py native.log \
          --threshold "$threshold" --summary "$GITHUB_STEP_SUMMARY"
        status=$?
        set -e
        if [ "$status" = 2 ]; then
          # A run that should carry samples and has none is the failure this
          # watcher exists for: the sampler died before its first write, and
          # no window would ever show it.
          if [ "$SAMPLER_EVENT" = "schedule" ] ||
             [ "$SAMPLER_EVENT" = "workflow_dispatch" ]; then
            echo "::error::No VM sample although this run is"\
              "$SAMPLER_EVENT: the sampler did not write a single line."
            exit 1
          fi
          echo "::notice::No VM sample in this log: the sampler does not run"\
            "for ${SAMPLER_EVENT:-unknown} runs."
          exit 0
        fi
        if [ "$status" = 1 ]; then
          echo "::error::The arm64 run has a VM sampling problem: see the"\
            "summary."
        fi
        exit "$status"
