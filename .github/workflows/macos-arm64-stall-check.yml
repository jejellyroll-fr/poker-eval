name: macOS arm64 stall check

# `Native Tests (arm64)` prints `== HH:MM:SS`, the load average, `vm_stat` and
# the busiest processes every two seconds on a nightly or a manual dispatch
# (macos-arm64.yml). A window without a sample is a window in which that
# runner made no progress: run 44828726427 lost 66 s and 74 s that way, and
# ctest charged each of them to the cases it caught (docs/ci.md). Nobody reads
# a nine-thousand-line log looking for that, so this watcher does.
#
# It runs on `ubuntu-latest` and only downloads the log of a run that already
# finished: it never requests an arm64 runner, never touches the run it
# inspects, and fails only when a window over the threshold is found.
#
# Pull-request runs carry no sample on purpose (the sampler is gated on
# `schedule` and `workflow_dispatch` in macos-arm64.yml), so the job is gated
# on those two events as well. A run whose native-test job never started, or
# that the pool starved, is reported as having nothing to inspect — that case
# belongs to macos-arm64-capacity-rerun.yml.

on:
  workflow_run:
    workflows: ["macOS arm64"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'macOS arm64 run id to inspect'
        required: true
      threshold:
        description: 'Report windows longer than this many seconds'
        default: '10'

permissions:
  actions: read
  contents: read

concurrency:
  group: arm64-stall-check-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  stalls:
    name: Report VM sampling gaps
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5

    - name: Download the native test log
      id: log
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        INPUT_RUN_ID: ${{ inputs.run_id }}
      run: |
        set -euo pipefail
        run_id="${EVENT_RUN_ID:-$INPUT_RUN_ID}"
        echo "run=$run_id" >> "$GITHUB_OUTPUT"

        selector='[.jobs[] | select(.name == "Native Tests (arm64)")][0]'
        jobs_api="repos/$GH_REPO/actions/runs/$run_id/jobs"
        job_id=$(gh api "$jobs_api" --paginate --jq "$selector.id")
        conclusion=$(gh api "$jobs_api" --paginate --jq "$selector.conclusion")
        echo "job=$job_id conclusion=$conclusion"

        # A job the pool never served has no log, and a skipped one was never
        # meant to run: there is nothing to look at in either case.
        if [ "$job_id" = "null" ]; then
          echo "Nothing to inspect: no native-test job in run $run_id."
          exit 0
        fi
        if [ "$conclusion" != "success" ] &&
           [ "$conclusion" != "failure" ]; then
          echo "Nothing to inspect: the native-test job is $conclusion."
          exit 0
        fi

        # Logs of old runs expire, and that says nothing about this watcher.
        logs="repos/$GH_REPO/actions/jobs/$job_id/logs"
        if ! gh api "$logs" > native.log; then
          echo "Nothing to inspect: the log of job $job_id is not available."
          exit 0
        fi
        echo "lines=$(wc -l < native.log)"
        echo "inspect=yes" >> "$GITHUB_OUTPUT"

    - name: Report windows over the threshold
      if: steps.log.outputs.inspect == 'yes'
      env:
        EVENT_THRESHOLD: ${{ inputs.threshold }}
      run: |
        threshold="${EVENT_THRESHOLD:-10}"
        # The step runs under `bash -e`, which would abort on the exit status
        # the script uses to say what it found, so it is read before anything
        # decides.
        set +e
        python3 scripts/check_arm64_vm_stalls.py native.log \
          --threshold "$threshold" --summary "$GITHUB_STEP_SUMMARY"
        status=$?
        set -e
        if [ "$status" = 2 ]; then
          echo "::notice::No VM sample in this log: the sampler did not reach"\
            "the suite, so there is no window to report."
          exit 0
        fi
        if [ "$status" = 1 ]; then
          echo "::error::The arm64 runner stopped sampling: see the summary."
        fi
        exit "$status"
