name: Sanitizers, Valgrind & Static Analysis

# INFRA-01 (issue #97): give CI a memory-error safety net instead of assuming
# the bugs it is meant to catch are absent.
#
#   - ASan + UBSan over the full test suite, gating on every PR/push to master.
#     LSan is folded in via ASan's leak detection, so BUG-06/09/10/12-class
#     regressions fail the build the moment they land.
#   - Valgrind on a short solve (bench_cfr_omaha_river --iters 50) with a leak
#     byte threshold, so a slow-growing leak still breaks CI rather than
#     accumulating silently.
#   - cppcheck --enable=all in non-blocking mode, to start surfacing issues
#     without gating merges on its (noisy) output yet.
#
# Acceptance: the ASan job fails on a deliberately introduced use-after-free.
# That is verified on a throwaway branch (a test that frees then reads a
# buffer) — the production suite must stay green, so the broken test is NOT
# committed here; the capability is what gates, and any UAF in the real suite
# trips it the same way.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: ASan + UBSan (full suite)
    runs-on: ubuntu-latest
    # Gating on purpose (INFRA-01, issue #97): the sanitizer job must fail the
    # build when it catches a leak, out-of-bounds, or undefined behaviour. The
    # 7 baseline failures from PR #177 were resolved in PR #180 (defensive
    # get_strategy fix + sanitizer-skip quarantine of the 3 slow tests), and a
    # clean-master re-run (31678152049) passed 163/163 with LSan active and no
    # diagnostics. A red run now means a real memory bug landed and must be
    # fixed, not suppressed.
    timeout-minutes: 90
    env:
      # Halt on the first undefined-behaviour report and on leaks; print a
      # stack trace so the failure names something other than the runtime.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1

    steps:
      - uses: actions/checkout@v5

      - name: Configure (ASan + UBSan, Debug)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-san \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BINDINGS=OFF \
            -DBUILD_GPU=OFF \
            -DENABLE_OPENMP=OFF \
            -DENABLE_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build-san --parallel

      - name: Smoke pass (core regression)
        run: |
          cd build-san
          ctest --output-on-failure -R "test_canonical_regression|test_canonical_invariants|test_omaha_invariants"

      - name: Full test suite under sanitizers
        run: |
          cd build-san
          # Per-test timeout generous: ASan/UBSan slow heavy suites (CFR,
          # range parsing) well past the 30s the bare build stays under.
          # Exclude the 3 tests that are correct but too slow under
          # instrumentation to finish in time (INFRA-01 #97 follow-up) — they
          # keep running in the unsanitized suite, so we only drop their
          # memory-check signal, not their correctness coverage.
          ctest --output-on-failure --timeout 300 -LE sanitizer-skip

  valgrind:
    name: Valgrind (CFR solve, leak threshold)
    runs-on: ubuntu-latest
    # Gating: a leak above the threshold fails CI so the finding cannot rot.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends valgrind || true

      - name: Configure (Release)
        run: |
          cmake -S . -B build-vg \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_BINDINGS=OFF \
            -DBUILD_GPU=OFF \
            -DENABLE_OPENMP=OFF \
            -DENABLE_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build-vg --parallel

      - name: Run short solve under Valgrind
        run: |
          set -euo pipefail
          LOG="$(pwd)/valgrind.log"
          BIN="$(find build-vg -type f -name bench_cfr_omaha_river -perm -111 -print -quit)"
          if [ -z "$BIN" ]; then
            echo "Benchmark binary not found under build-vg"; find build-vg -type f -maxdepth 5 | sort; exit 1
          fi
          # Run the benchmark *through* Valgrind so the log contains a real
          # leak summary. --error-exitcode=42 makes Valgrind return 42 on
          # errors, so we capture its status in a construct exempt from
          # errexit (`|| BENCH_RC=$?`) instead of letting `set -e` abort here;
          # the threshold checks below decide the outcome.
          valgrind --leak-check=full --error-exitcode=42 \
            --log-file="$LOG" \
            "$BIN" --iters 50 --deals 50 --csv /tmp/cfr_omaha_river.csv \
            || BENCH_RC=$?
          BENCH_RC=${BENCH_RC:-0}

          if [ ! -s "$LOG" ]; then
            echo "Valgrind produced no log output — aborting (cannot trust a 0-byte result)"
            exit 1
          fi

          echo "=== Valgrind summary ==="
          grep -E "ERROR SUMMARY|definitely lost|indirectly lost|possibly lost|still reachable" "$LOG" || true

          # Refuse to pass on a malformed or missing summary line. A missing
          # ERROR SUMMARY means Valgrind did not run to completion (crash,
          # startup failure, truncated log), and a 0-byte "clean" result would
          # otherwise hide an execution failure masked by `|| true`.
          if ! grep -qE "ERROR SUMMARY: [0-9]+ errors" "$LOG"; then
            echo "No usable Valgrind ERROR SUMMARY — the run did not complete cleanly"; cat "$LOG"; exit 1
          fi

          # A non-leak benchmark crash still fails the job (we preserved the
          # real exit code above instead of discarding it). 42 is Valgrind's
          # own "errors found" code, which the threshold check below handles.
          if [ "$BENCH_RC" -ne 0 ] && [ "$BENCH_RC" -ne 42 ]; then
            echo "Benchmark execution failed under Valgrind (rc=$BENCH_RC)"; exit 1
          fi

          # Fail on definite/indirect leaks above a small threshold so the
          # finding cannot rot. "still reachable" is tolerated (allocations at
          # exit that the runtime owns).
          DEF_LOST=$(grep -E "definitely lost:" "$LOG" | grep -oE "[0-9,]+ bytes" | head -1 | tr -d ', bytes' || true)
          IND_LOST=$(grep -E "indirectly lost:" "$LOG" | grep -oE "[0-9,]+ bytes" | head -1 | tr -d ', bytes' || true)
          DEF_LOST=${DEF_LOST:-0}; IND_LOST=${IND_LOST:-0}
          THRESHOLD=1024
          echo "definitely lost: ${DEF_LOST} bytes, indirectly lost: ${IND_LOST} bytes, threshold: ${THRESHOLD} bytes"
          if [ "$DEF_LOST" -gt "$THRESHOLD" ] || [ "$IND_LOST" -gt "$THRESHOLD" ]; then
            echo "Leak threshold exceeded:"; cat "$LOG"; exit 1
          fi

  cppcheck:
    name: cppcheck (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Surface static-analysis findings without gating merges yet.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cppcheck || true

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --std=c99 --quiet \
            -i build -i third_party -i include/poker_eval/gpu \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            src include 2>cppcheck-report.txt || true
          echo "=== cppcheck findings (non-blocking) ==="
          cat cppcheck-report.txt || true

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cppcheck-report
          path: cppcheck-report.txt
