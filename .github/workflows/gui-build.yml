name: GUI Build (SDL2)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  gui-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure: >-
              cmake -S . -B build -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=ON
              -DBUILD_BINDINGS=OFF -DBUILD_GPU=OFF -DENABLE_OPENMP=OFF
            build: cmake --build build --target poker-eval-trainer-gui -j
            binary: build/tools/poker-eval-trainer-gui
          - os: macos-14
            configure: >-
              cmake -S . -B build -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=ON
              -DBUILD_BINDINGS=OFF -DBUILD_GPU=OFF -DENABLE_OPENMP=OFF
            build: cmake --build build --target poker-eval-trainer-gui -j
            binary: build/tools/poker-eval-trainer-gui
          # Windows uses the project preset (Visual Studio generator, static
          # libs) and stages SDL2.dll next to the executable for the smoke.
          # The preset uses the Visual Studio 17 2022 generator. Keep this
          # runner aligned with that generator instead of windows-latest,
          # whose image can move to a newer Visual Studio before the preset
          # is updated.
          - os: windows-2022
            configure: >-
              cmake --preset windows-msvc
              -DPE_SDL2_ROOT="$env:PE_SDL2_CI_ROOT"
              -DPE_SDL2_INCLUDE_DIR="$env:PE_SDL2_CI_ROOT/include"
              -DPE_SDL2_LIBRARY="$env:PE_SDL2_CI_ROOT/lib/x64/SDL2.lib"
              -DCMAKE_C_FLAGS="/I$env:PE_SDL2_CI_ROOT/include"
            build: >-
              cmake --build build/windows-msvc --target poker-eval-trainer-gui
              --config Release
            binary: build/windows-msvc/tools/Release/poker-eval-trainer-gui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-2.30.12/SDL2-devel-2.30.12-VC.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sdl2.zip"
          Expand-Archive "$env:RUNNER_TEMP\sdl2.zip" -DestinationPath "$env:RUNNER_TEMP\sdl2"
          $sdl2Root = (Join-Path $env:RUNNER_TEMP "sdl2\SDL2-2.30.12").Replace('\', '/')
          if (-not (Test-Path "$sdl2Root/include/SDL2/SDL.h")) {
            throw "SDL2 header not found under $sdl2Root"
          }
          if (-not (Test-Path "$sdl2Root/lib/x64/SDL2.lib")) {
            throw "SDL2 library not found under $sdl2Root"
          }
          "CMAKE_PREFIX_PATH=$sdl2Root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PE_SDL2_CI_ROOT=$sdl2Root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: ${{ matrix.configure }}

      # The GUI target only exists when CMake found SDL2, so a missing SDL2
      # fails this step instead of silently skipping the GUI.
      - name: Build GUI
        run: ${{ matrix.build }}

      - name: Stage SDL2.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Copy-Item
          "$env:RUNNER_TEMP\sdl2\SDL2-2.30.12\lib\x64\SDL2.dll"
          -Destination "build\windows-msvc\tools\Release\"

      - name: Check binary
        shell: bash
        run: test -e "${{ matrix.binary }}"

      - name: Headless usage smoke
        shell: bash
        run: SDL_VIDEODRIVER=dummy "${{ matrix.binary }}" --help
