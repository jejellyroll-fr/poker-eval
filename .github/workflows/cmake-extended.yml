name: CMake Extended (manual)

# Jobs extracted from cmake.yml, which was dead for the whole life of the repo:
# it triggered on main/develop, two branches this repository never had. None of
# these has ever been observed to pass, so they run on demand only. Promote a
# job back into cmake.yml once it is green.

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # Moved out of cmake.yml when it was revived: both fail for reasons that are
  # not about this workflow.
  #
  #   macOS GCC   - `brew install gcc@11` no longer resolves on the ARM64
  #                 images. Needs an unpinned gcc, and whatever that surfaces.
  #   Debug+cov   - assert() is compiled out by NDEBUG in Release, so a Debug
  #                 build fires assertions in stud_distribution_test,
  #                 test_scoop_count, razz, test_badugi and
  #                 test_ofc_comprehensive. Those are library invariants that
  #                 do not hold, not a CI problem.
  macos-gcc:
    name: macOS GCC (unpinned)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        brew install ninja gcc
        echo "CC=$(brew --prefix gcc)/bin/gcc-$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)" >> $GITHUB_ENV
    - name: Configure
      run: cmake --preset default
    - name: Build
      run: cmake --build --preset default --parallel

  linux-debug-coverage:
    name: Linux GCC Debug Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build lcov
    - name: Configure
      run: cmake --preset debug
    - name: Build
      run: cmake --build --preset debug --parallel
    - name: Test
      run: ctest --preset debug --output-on-failure

    # Generator-neutral: the debug preset uses Ninja, so `make coverage-report`
    # would look for a Makefile that a Ninja tree does not have.
    - name: Generate coverage report
      run: cmake --build --preset debug --target coverage-report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
      with:
        file: ./build/debug/coverage/coverage.info
        flags: unittests
        name: codecov-umbrella

  build-with-package-managers:
    name: Build with ${{ matrix.package-manager }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package-manager: [vcpkg, conan]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup vcpkg
      if: matrix.package-manager == 'vcpkg'
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=$PWD/vcpkg" >> $GITHUB_ENV
    
    - name: Setup Conan
      if: matrix.package-manager == 'conan'
      run: |
        pip install conan
        conan profile detect
    
    - name: Build with vcpkg
      if: matrix.package-manager == 'vcpkg'
      run: |
        cmake --preset vcpkg
        cmake --build build/vcpkg
    
    - name: Build with Conan
      if: matrix.package-manager == 'conan'
      run: |
        conan install . --build=missing
        conan build .

  build-cross-compile:
    name: Cross-compile for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [arm64, armhf]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install cross-compilation tools
      run: |
        sudo apt-get update
        if [ "${{ matrix.target }}" = "arm64" ]; then
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        else
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        fi
    
    - name: Configure for cross-compilation
      run: |
        if [ "${{ matrix.target }}" = "arm64" ]; then
          cmake -B build -S . \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64
        else
          cmake -B build -S . \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm
        fi
    
    - name: Build
      run: cmake --build build --parallel

  create-packages:
    name: Create packages
    # The build job it used to depend on stayed in cmake.yml; this one configures
    # and builds on its own.
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build rpm
    
    - name: Configure
      run: cmake --preset release
    
    - name: Build
      run: cmake --build --preset release
    
    - name: Create packages
      run: |
        cd build/release
        cpack -G TGZ
        cpack -G DEB
        cpack -G RPM
    
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: |
          build/release/*.tar.gz
          build/release/*.deb
          build/release/*.rpm
