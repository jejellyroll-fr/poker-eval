name: CMake Build

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            preset: linux-gcc
          
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            preset: linux-clang
          
          # macOS builds
          - name: macOS Clang
            os: macos-latest
            compiler: clang
            preset: macos
          
          # Windows builds
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build lcov gdb
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang libomp-dev
        else
          sudo apt-get install -y gcc g++
        fi
    
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja
        if [ "${{ matrix.compiler }}" = "gcc-11" ]; then
          brew install gcc@11
          echo "CC=gcc-11" >> $GITHUB_ENV
          echo "CXX=g++-11" >> $GITHUB_ENV
        fi
    
    - name: Install dependencies (Windows MinGW)
      if: runner.os == 'Windows' && matrix.compiler == 'mingw'
      run: |
        choco install mingw ninja
        echo "CC=gcc" >> $env:GITHUB_ENV
        echo "CXX=g++" >> $env:GITHUB_ENV
    
    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}
    
    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel

    - name: Diagnose Linux race with ThreadSanitizer
      if: runner.os == 'Linux' && matrix.compiler == 'gcc'
      run: |
        cmake -S . -B build/linux-tsan -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS_DEBUG="-g -O1 -Wno-error=return-type" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
        cmake --build build/linux-tsan --target test_mpf_perf_stats --parallel
        TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1" \
          build/linux-tsan/tests/test_mpf_perf_stats

    - name: Stress Linux crash regressions
      if: runner.os == 'Linux'
      run: |
        if ! ctest --preset "${{ matrix.preset }}" \
          --output-on-failure \
          --repeat until-fail:20 \
          -R '^(test_mpf_perf_stats|test_enumerate_dispatch)$'; then
          gdb --batch \
            -ex run \
            -ex "thread apply all backtrace full" \
            --args "build/${{ matrix.preset }}/tests/test_mpf_perf_stats"
          exit 1
        fi
    
    - name: Test
      run: ctest --preset ${{ matrix.preset }} --output-on-failure
    


# The vcpkg/Conan, cross-compilation and CPack jobs that used to live here
# moved to cmake-extended.yml. They have never run - this workflow was
# triggered on branches that do not exist - so they are manual until someone
# makes them pass rather than red on every pull request.
