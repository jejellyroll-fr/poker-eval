name: CMake Build

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            preset: linux-gcc
          
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            preset: linux-clang
          
          # macOS builds
          - name: macOS Clang
            os: macos-latest
            compiler: clang
            preset: macos
          
          # Windows builds
          - name: Windows MSVC
            os: windows-2022
            compiler: msvc
            preset: windows-msvc

          - name: Windows MinGW
            os: windows-latest
            compiler: mingw
            preset: windows-mingw
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 || true
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends lcov libomp-dev || true
    
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja
        if [ "${{ matrix.compiler }}" = "gcc-11" ]; then
          brew install gcc@11
          echo "CC=gcc-11" >> $GITHUB_ENV
          echo "CXX=g++-11" >> $GITHUB_ENV
        fi
    
    - name: Install dependencies (Windows MinGW)
      if: runner.os == 'Windows' && matrix.compiler == 'mingw'
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-ninja

    - name: Configure MinGW environment
      if: runner.os == 'Windows' && matrix.compiler == 'mingw'
      shell: pwsh
      run: |
        echo "CC=gcc" >> $env:GITHUB_ENV
        echo "CXX=g++" >> $env:GITHUB_ENV
    
    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}
    
    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel

    - name: Add MinGW build DLLs to PATH
      if: runner.os == 'Windows' && matrix.compiler == 'mingw'
      shell: pwsh
      run: |
        Get-ChildItem "build/${{ matrix.preset }}" -Recurse -Filter *.dll |
          ForEach-Object { $_.DirectoryName } |
          Sort-Object -Unique |
          ForEach-Object { $_ >> $env:GITHUB_PATH }

    - name: Stress Linux crash regressions
      if: runner.os == 'Linux'
      run: >-
        ctest --preset ${{ matrix.preset }}
        --output-on-failure
        --repeat until-fail:20
        -R '^(test_mpf_perf_stats|test_enumerate_dispatch)$'
    
    - name: Test
      run: ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 60
    


# The vcpkg/Conan, cross-compilation and CPack jobs that used to live here
# moved to cmake-extended.yml. They have never run - this workflow was
# triggered on branches that do not exist - so they are manual until someone
# makes them pass rather than red on every pull request.
