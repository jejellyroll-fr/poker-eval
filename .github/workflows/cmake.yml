name: CMake Build

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            preset: linux-gcc
          
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            preset: linux-clang
          
          - name: Linux GCC Debug Coverage
            os: ubuntu-latest
            compiler: gcc
            preset: debug
            coverage: true
          
          # macOS builds
          - name: macOS Clang
            os: macos-latest
            compiler: clang
            preset: macos
          
          - name: macOS GCC
            os: macos-latest
            compiler: gcc-11
            preset: default
          
          # Windows builds
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc
            preset: windows-msvc
          
          - name: Windows MinGW
            os: windows-latest
            compiler: mingw
            preset: default

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build lcov
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang libomp-dev
        else
          sudo apt-get install -y gcc g++
        fi
    
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja
        if [ "${{ matrix.compiler }}" = "gcc-11" ]; then
          brew install gcc@11
          echo "CC=gcc-11" >> $GITHUB_ENV
          echo "CXX=g++-11" >> $GITHUB_ENV
        fi
    
    - name: Install dependencies (Windows MinGW)
      if: runner.os == 'Windows' && matrix.compiler == 'mingw'
      run: |
        choco install mingw ninja
        echo "CC=gcc" >> $env:GITHUB_ENV
        echo "CXX=g++" >> $env:GITHUB_ENV
    
    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}
    
    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel
    
    - name: Test
      run: ctest --preset ${{ matrix.preset }} --output-on-failure
    
    - name: Generate Coverage Report
      if: matrix.coverage
      run: |
        cd build/${{ matrix.preset }}
        make coverage-report
    
    - name: Upload Coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
      with:
        file: ./build/${{ matrix.preset }}/coverage/coverage.info
        flags: unittests
        name: codecov-umbrella


# The vcpkg/Conan, cross-compilation and CPack jobs that used to live here
# moved to cmake-extended.yml. They have never run - this workflow was
# triggered on branches that do not exist - so they are manual until someone
# makes them pass rather than red on every pull request.
