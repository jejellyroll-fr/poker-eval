name: CMake Build

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # GitHub's hosted macOS pool is starved often enough that the queue alone
    # can exhaust the budget; a job cancelled before its first step still
    # marks the run failed. Each leg carries its own budget below: the blocking
    # Intel leg gets an hour, the best-effort arm64 leg is bounded so an
    # unassigned runner cannot hang the run for long.
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            preset: linux-gcc
            timeout: 25
          
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            preset: linux-clang
            timeout: 25
          
          # macOS builds. The Intel leg is the blocking one: GitHub annotates
          # arm64 jobs with "Due to capacity constraints, jobs targeting macOS
          # arm64 runners may experience longer queue times", and on some days
          # they are not assigned at all. The arm64 leg still runs here as
          # best effort, so the image keeps getting real builds, but its
          # result cannot fail a pull request.
          - name: macOS Clang (Intel)
            os: macos-15-intel
            compiler: clang
            preset: macos
            timeout: 60

          - name: macOS Clang (arm64, best effort)
            os: macos-15
            compiler: clang
            preset: macos
            timeout: 30
          
          # Windows builds
          - name: Windows MSVC
            os: windows-2022
            compiler: msvc
            preset: windows-msvc
            timeout: 25

          - name: Windows MinGW
            os: windows-latest
            compiler: mingw
            preset: windows-mingw
            timeout: 25
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        # Keep the runner's Azure-local mirror (the fast path here) and let apt
        # retry the download; see the note in gpu-build.yml. A slow mirror must
        # fail this step with the real apt error rather than be masked by
        # `|| true` and surface later as a missing tool.
        sudo DEBIAN_FRONTEND=noninteractive apt-get update \
          -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
          -o Acquire::https::Timeout=30
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          --no-install-recommends lcov libomp-dev
    
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja
        if [ "${{ matrix.compiler }}" = "gcc-11" ]; then
          brew install gcc@11
          echo "CC=gcc-11" >> $GITHUB_ENV
          echo "CXX=g++-11" >> $GITHUB_ENV
        fi
    
    - name: Install dependencies (Windows MinGW)
      if: runner.os == 'Windows' && matrix.compiler == 'mingw'
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-ninja

    - name: Configure MinGW environment
      if: runner.os == 'Windows' && matrix.compiler == 'mingw'
      shell: pwsh
      run: |
        echo "CC=gcc" >> $env:GITHUB_ENV
        echo "CXX=g++" >> $env:GITHUB_ENV
    
    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}
    
    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel

    - name: Add MinGW build DLLs to PATH
      if: runner.os == 'Windows' && matrix.compiler == 'mingw'
      shell: pwsh
      run: |
        Get-ChildItem "build/${{ matrix.preset }}" -Recurse -Filter *.dll |
          ForEach-Object { $_.DirectoryName } |
          Sort-Object -Unique |
          ForEach-Object { $_ >> $env:GITHUB_PATH }

    - name: Stress Linux crash regressions
      if: runner.os == 'Linux'
      run: >-
        ctest --preset ${{ matrix.preset }}
        --output-on-failure
        --repeat until-fail:20
        -R '^(test_mpf_perf_stats|test_enumerate_dispatch)$'
    
    - name: Test
      run: ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 60
    


# The vcpkg/Conan, cross-compilation and CPack jobs that used to live here
# moved to cmake-extended.yml. They have never run - this workflow was
# triggered on branches that do not exist - so they are manual until someone
# makes them pass rather than red on every pull request.
