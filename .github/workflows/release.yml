name: Release Builds

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-native:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            asset_name: poker-eval-v1.1.0-linux-x86_64.tar.gz
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=ON"
          - name: macOS ARM64
            os: macos-14
            asset_name: poker-eval-v1.1.0-macos-arm64.tar.gz
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=ON"
          - name: macOS x86_64
            os: macos-13
            asset_name: poker-eval-v1.1.0-macos-x86_64.tar.gz
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=ON"
          - name: Windows x86_64
            os: windows-latest
            asset_name: poker-eval-v1.1.0-windows-x86_64.zip
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release_pkg/bin release_pkg/include release_pkg/lib
          cp -r bin/* release_pkg/bin/ 2>/dev/null || true
          cp -r include/poker_eval release_pkg/include/ 2>/dev/null || true
          cp -r lib/* release_pkg/lib/ 2>/dev/null || true
          cd release_pkg && tar -czvf ../${{ matrix.asset_name }} *

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_pkg\bin, release_pkg\include, release_pkg\lib -Force
          Copy-Item -Path bin\* -Destination release_pkg\bin\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path include\poker_eval -Destination release_pkg\include\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path lib\* -Destination release_pkg\lib\ -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path release_pkg\* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    name: Build (Linux ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure CMake for Linux ARM64
        run: |
          cmake -B build -S . \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_C_API=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package Linux ARM64
        run: |
          mkdir -p release_pkg/bin release_pkg/include release_pkg/lib
          cp -r bin/* release_pkg/bin/ 2>/dev/null || true
          cp -r include/poker_eval release_pkg/include/ 2>/dev/null || true
          cp -r lib/* release_pkg/lib/ 2>/dev/null || true
          cd release_pkg && tar -czvf ../poker-eval-v1.1.0-linux-arm64.tar.gz *

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: poker-eval-v1.1.0-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-arm64:
    name: Build (Windows ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake for Windows ARM64
        shell: powershell
        run: |
          cmake -B build -S . -A ARM64 -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON

      - name: Build
        shell: powershell
        run: cmake --build build --config Release

      - name: Package Windows ARM64
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_pkg\bin, release_pkg\include, release_pkg\lib -Force
          Copy-Item -Path bin\* -Destination release_pkg\bin\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path include\poker_eval -Destination release_pkg\include\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path lib\* -Destination release_pkg\lib\ -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path release_pkg\* -DestinationPath poker-eval-v1.1.0-windows-arm64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: poker-eval-v1.1.0-windows-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-freebsd:
    name: Build (FreeBSD x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake gmake
          run: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON
            cmake --build build -j$(sysctl -n hw.ncpu)
            mkdir -p release_pkg/bin release_pkg/include release_pkg/lib
            cp -r bin/* release_pkg/bin/ 2>/dev/null || true
            cp -r include/poker_eval release_pkg/include/ 2>/dev/null || true
            cp -r lib/* release_pkg/lib/ 2>/dev/null || true
            cd release_pkg && tar -czvf ../poker-eval-v1.1.0-freebsd-x86_64.tar.gz *

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: poker-eval-v1.1.0-freebsd-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
