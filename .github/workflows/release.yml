name: Release Builds

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: poker-eval-v1.1.0-linux-x86_64.tar.gz
            asset_name: poker-eval-v1.1.0-linux-x86_64.tar.gz
          - os: macos-latest
            artifact_name: poker-eval-v1.1.0-macos.tar.gz
            asset_name: poker-eval-v1.1.0-macos.tar.gz
          - os: windows-latest
            artifact_name: poker-eval-v1.1.0-windows-x64.zip
            asset_name: poker-eval-v1.1.0-windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_C_API=ON \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release_pkg/bin release_pkg/include release_pkg/lib
          cp -r bin/* release_pkg/bin/ 2>/dev/null || true
          cp -r include/poker_eval release_pkg/include/ 2>/dev/null || true
          cp -r lib/* release_pkg/lib/ 2>/dev/null || true
          cd release_pkg && tar -czvf ../${{ matrix.asset_name }} *

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_pkg\bin, release_pkg\include, release_pkg\lib -Force
          Copy-Item -Path bin\* -Destination release_pkg\bin\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path include\poker_eval -Destination release_pkg\include\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path lib\* -Destination release_pkg\lib\ -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path release_pkg\* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
