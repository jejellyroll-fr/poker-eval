name: Release Builds

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the assets to (e.g. v1.2.0)'
        required: true

# The tag being released, taken from whatever triggered the run. Hard-coding it
# meant every release after the first published its artifacts onto the old one.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

jobs:
  build-native:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            asset_suffix: linux-x86_64.tar.gz
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=ON"
          - name: macOS ARM64
            os: macos-14
            asset_suffix: macos-arm64.tar.gz
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=ON"
          - name: macOS x86_64
            os: macos-13
            asset_suffix: macos-x86_64.tar.gz
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=ON"
          - name: Windows x86_64
            os: windows-latest
            asset_suffix: windows-x86_64.zip
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Configure CMake
        run: cmake -S . -B build ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release_pkg/bin release_pkg/include release_pkg/lib
          cp -R include/poker_eval release_pkg/include/
          find build -type f \( -name "*.a" -o -name "*.dylib" -o -name "*.so*" \) -exec cp -p {} release_pkg/lib/ \; 2>/dev/null || true
          find build -type f -perm +111 ! -name "*.dylib" ! -name "*.so*" ! -name "*.a" ! -name "*.sh" -exec cp -p {} release_pkg/bin/ \; 2>/dev/null || true
          ASSET="poker-eval-${RELEASE_TAG}-${{ matrix.asset_suffix }}"
          cd release_pkg && tar -czvf "../${ASSET}" *
          echo "ASSET_NAME=${ASSET}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_pkg\bin, release_pkg\include, release_pkg\lib -Force
          Copy-Item -Path include\poker_eval -Destination release_pkg\include\ -Recurse
          Get-ChildItem -Path build -Recurse -Include *.lib, *.dll, *.a, *.pdb | Copy-Item -Destination release_pkg\lib\ -Force
          Get-ChildItem -Path build -Recurse -Include *.exe | Copy-Item -Destination release_pkg\bin\ -Force -ErrorAction SilentlyContinue
          $asset = "poker-eval-$env:RELEASE_TAG-${{ matrix.asset_suffix }}"
          Compress-Archive -Path release_pkg\* -DestinationPath $asset
          "ASSET_NAME=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    name: Build (Linux ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure CMake for Linux ARM64
        run: |
          cmake -B build -S . \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_C_API=ON \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package Linux ARM64
        run: |
          mkdir -p release_pkg/bin release_pkg/include release_pkg/lib
          cp -R include/poker_eval release_pkg/include/
          find build -type f \( -name "*.a" -o -name "*.dylib" -o -name "*.so*" \) -exec cp -p {} release_pkg/lib/ \; 2>/dev/null || true
          find build -type f -executable ! -name "*.dylib" ! -name "*.so*" ! -name "*.a" -exec cp -p {} release_pkg/bin/ \; 2>/dev/null || true
          cd release_pkg && tar -czvf "../poker-eval-${RELEASE_TAG}-linux-arm64.tar.gz" *

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: poker-eval-${{ env.RELEASE_TAG }}-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-arm64:
    name: Build (Windows ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Configure CMake for Windows ARM64
        shell: powershell
        run: |
          cmake -B build -S . -A ARM64 -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_C_API=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF

      - name: Build
        shell: powershell
        run: cmake --build build --config Release

      - name: Package Windows ARM64
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_pkg\bin, release_pkg\include, release_pkg\lib -Force
          Copy-Item -Path include\poker_eval -Destination release_pkg\include\ -Recurse
          Get-ChildItem -Path build -Recurse -Include *.lib, *.dll, *.a | Copy-Item -Destination release_pkg\lib\ -Force
          Get-ChildItem -Path build -Recurse -Include *.exe | Copy-Item -Destination release_pkg\bin\ -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path release_pkg\* -DestinationPath "poker-eval-$env:RELEASE_TAG-windows-arm64.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: poker-eval-${{ env.RELEASE_TAG }}-windows-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-freebsd:
    name: Build (FreeBSD x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake gmake
          run: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_C_API=ON
            cmake --build build
            mkdir -p release_pkg/bin release_pkg/include release_pkg/lib
            cp -R include/poker_eval release_pkg/include/
            find build -type f \( -name "*.a" -o -name "*.so*" \) -exec cp {} release_pkg/lib/ \; 2>/dev/null || true
            tar -czvf poker-eval-${{ env.RELEASE_TAG }}-freebsd-x86_64.tar.gz -C release_pkg .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: poker-eval-${{ env.RELEASE_TAG }}-freebsd-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wheels:
    name: Build Python Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-13, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build Wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.23.0
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"

      - name: Upload Release Wheels
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: wheelhouse/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
