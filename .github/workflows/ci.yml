name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  test-release:
    name: Release Build & Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev

    - name: Configure Release Build
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=ON \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF

    - name: Build
      run: |
        cd build
        make -j"$(nproc)"

    - name: Run Core Regression Tests
      run: |
        cd build
        ctest --output-on-failure -R "test_canonical_regression|test_canonical_invariants|test_omaha_invariants"

    - name: Run Full Test Suite
      run: |
        cd build
        ctest --output-on-failure

    - name: Performance Benchmark (Quiet Mode)
      run: |
        cd build
        timeout 60s ./src/examples/omaha_combinations_example --quiet
        timeout 60s ./bin/bench_7c_hilo_singlepass

    - name: Generate Performance Report
      run: |
        cd build
        {
          echo "# Performance Report - $(date)"
          echo "## Build: Release -O3 -DNDEBUG"
          echo "## Test Results:"
          echo "- Core regression tests: ✅ Passed"
          echo "- Full test suite: ✅ Passed"
          echo "## Sample Performance:"
          timeout 30s ./src/examples/omaha_combinations_example --quiet
        } > performance_report.md 2>&1

    - name: Upload Performance Report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report-release
        path: build/performance_report.md

  test-debug-sanitizers:
    name: Debug + Sanitizers (Weekly)
    runs-on: ubuntu-latest
    # Run only on schedule or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang libssl-dev

    - name: Configure Debug + Sanitizers
      run: |
        mkdir build
        cd build
        CC=clang cmake .. \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_SANITIZERS=ON \
          -DBUILD_TESTS=ON \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF

    - name: Build with Sanitizers
      run: |
        cd build
        make -j"$(nproc)"

    - name: Run Tests with Sanitizers
      run: |
        cd build
        # Run core tests with AddressSanitizer/UBSan
        ctest --output-on-failure -R "test_canonical_regression|test_canonical_invariants|test_omaha_invariants"

  benchmark-performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev

    - name: Configure Optimized Build
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_LTO=ON \
          -DBUILD_TESTS=OFF \
          -DBUILD_EXAMPLES=ON \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF

    - name: Build
      run: |
        cd build
        make -j"$(nproc)"

    - name: Run 7→5 Performance Test
      run: |
        ./build/bin/bench_7c_simd_micro > build/7to5_benchmark.txt

    - name: Run Hi/Lo Optimization Test
      run: |
        ./build/bin/bench_7c_hilo_singlepass > build/hilo_benchmark.txt

    - name: Create Benchmark Report
      run: |
        cd build
        {
          echo "# Benchmark Results - $(date)"
          echo "## 7→5 Combination Generator Performance"
          echo '```'
          cat 7to5_benchmark.txt
          echo '```'
          echo
          echo "## Hi/Lo Optimization Performance"
          echo '```'
          cat hilo_benchmark.txt
          echo '```'
        } > benchmark_report.md

    - name: Upload Benchmark Report
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-report
        path: build/benchmark_report.md
