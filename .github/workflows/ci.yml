name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  test-release:
    name: Release Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5

    - name: Configure Release Build
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=ON \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF

    - name: Build
      run: |
        cd build
        make -j"$(nproc)"

    - name: Compute benchmark regression guard
      run: |
        cmake --build build --target bench_pe_compute --parallel
        ./build/bin/bench_pe_compute --backend cpu_ref --csv > build/pe_compute.csv
        bash scripts/check_pe_compute_benchmark.sh \
          benchmarks/baseline/pe_compute.csv build/pe_compute.csv

    - name: Run Core Regression Tests
      run: |
        cd build
        ctest --output-on-failure -R "test_canonical_regression|test_canonical_invariants|test_omaha_invariants"

    - name: Run Full Test Suite
      run: |
        cd build
        ctest --output-on-failure

    - name: Run Stable C API Tests
      run: |
        cmake -S . -B build-c-api \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BINDINGS=ON \
          -DBUILD_C_API=ON \
          -DBUILD_PYTHON_BINDING=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF
        cmake --build build-c-api --target test_c_api_best_five -j"$(nproc)"
        ctest --test-dir build-c-api --output-on-failure -R test_c_api_best_five

    - name: Performance Benchmark (Quiet Mode)
      run: |
        cd build
        timeout 60s ./src/examples/omaha_combinations_example --quiet
        timeout 60s ./bin/bench_7c_hilo_singlepass

    - name: Generate Performance Report
      run: |
        cd build
        {
          echo "# Performance Report - $(date)"
          echo "## Build: Release -O3 -DNDEBUG"
          echo "## Test Results:"
          echo "- Core regression tests: ✅ Passed"
          echo "- Full test suite: ✅ Passed"
          echo "## Sample Performance:"
          timeout 30s ./src/examples/omaha_combinations_example --quiet
        } > performance_report.md 2>&1

    - name: Upload Performance Report
      uses: actions/upload-artifact@v6
      with:
        name: performance-report-release
        path: build/performance_report.md

  test-experimental:
    name: Experimental API Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One Linux job is enough to catch signature drift; no need to run the
    # flag across the whole platform matrix. Everything behind
    # POKER_EVAL_EXPERIMENTAL (Modern Equity API) is otherwise never
    # compiled in CI.

    steps:
    - uses: actions/checkout@v5

    - name: Configure Experimental API Build
      run: |
        cmake -S . -B build-experimental \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF \
          -DPOKER_EVAL_EXPERIMENTAL=ON

    - name: Build Experimental API
      run: cmake --build build-experimental -j"$(nproc)"

    # Without this the job would stay green while compiling none of the gated
    # code: everything behind POKER_EVAL_EXPERIMENTAL disappears when the flag
    # stops taking effect, and ctest would report success on the 148 remaining
    # tests. That is the very failure this job exists to prevent.
    #
    # Checking for poker_eval_modern_equity.c.o would prove nothing: the file is
    # compiled either way, it is its contents that are #ifdef'd out. Check the
    # gated symbol reached the library, and that the gated test was built at all.
    - name: Verify the experimental API was actually built
      run: |
        set -eu
        lib=$(find build-experimental -name 'libpoker_equity.so*' -type f | head -1)
        test -n "$lib"
        nm -g --defined-only "$lib" | grep -q poker_eval_calculate_equity
        test -x build-experimental/tests/test_modern_equity

    - name: Test Experimental API
      run: ctest --test-dir build-experimental --output-on-failure

  test-debug-sanitizers:
    name: Debug + Sanitizers (Weekly)
    runs-on: ubuntu-latest
    # Instrumented tests are slow; cap the job so a hang cannot sit on a runner
    # for the 6h default.
    timeout-minutes: 90
    # Run only on schedule or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      # UBSan reports and then carries on by default, so undefined behaviour
      # would be printed into the log while the job still went green. Halt on
      # the first report so it actually fails, and print a stack trace so the
      # report names something other than the sanitizer runtime.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang libssl-dev

    - name: Configure Debug + Sanitizers
      run: |
        mkdir build
        cd build
        CC=clang cmake .. \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_SANITIZERS=ON \
          -DBUILD_TESTS=ON \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF

    - name: Build with Sanitizers
      run: |
        cd build
        make -j"$(nproc)"

    - name: Run Core Regression Tests with Sanitizers
      run: |
        cd build
        # Fast smoke pass so an obvious breakage fails before the long run
        ctest --output-on-failure -R "test_canonical_regression|test_canonical_invariants|test_omaha_invariants"

    - name: Run Full Test Suite with Sanitizers
      run: |
        cd build
        # Whole suite, not an allowlist: the build already pays to instrument
        # every subsystem, and an allowlist silently excludes each new test.
        # Serial on purpose — parallel ASan processes are memory hungry for a
        # hosted runner. --timeout bounds a sanitizer hang per test.
        ctest --output-on-failure --timeout 900

  benchmark-performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev

    - name: Configure Optimized Build
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_LTO=ON \
          -DBUILD_TESTS=OFF \
          -DBUILD_EXAMPLES=ON \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF

    - name: Build
      run: |
        cd build
        make -j"$(nproc)"

    - name: Run 7→5 Performance Test
      run: |
        ./build/bin/bench_7c_simd_micro > build/7to5_benchmark.txt

    - name: Run Hi/Lo Optimization Test
      run: |
        ./build/bin/bench_7c_hilo_singlepass > build/hilo_benchmark.txt

    - name: Create Benchmark Report
      run: |
        cd build
        {
          echo "# Benchmark Results - $(date)"
          echo "## 7→5 Combination Generator Performance"
          echo '```'
          cat 7to5_benchmark.txt
          echo '```'
          echo
          echo "## Hi/Lo Optimization Performance"
          echo '```'
          cat hilo_benchmark.txt
          echo '```'
        } > benchmark_report.md

    - name: Upload Benchmark Report
      uses: actions/upload-artifact@v6
      with:
        name: benchmark-report
        path: build/benchmark_report.md

  test-native-multiarch:
    name: Native Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14]

    steps:
    - uses: actions/checkout@v5

    - name: Configure native test build
      run: |
        cmake -S . -B build-native \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF \
          -DENABLE_NATIVE_ARCH=OFF

    - name: Build native test build
      run: cmake --build build-native --parallel

    - name: Run native test suite
      run: ctest --test-dir build-native --output-on-failure --timeout 300

  test-portable-dispatch:
    name: Portable Build & SIMD Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5

    - name: Configure portable build
      run: |
        cmake -S . -B build-portable \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=OFF \
          -DENABLE_OPENMP=OFF \
          -DENABLE_NATIVE_ARCH=OFF

    - name: Build portable build
      run: cmake --build build-portable --parallel

    - name: Verify no ISA flag leaked into global compile flags
      run: |
        set -eu
        if rg -n -- '-mavx2|-mavx512f|-march=native' build-portable/compile_commands.json; then
          echo "An ISA-specific flag leaked into the portable build" >&2
          exit 1
        fi

    - name: Test runtime dispatch and runtime probing
      run: |
        ctest --test-dir build-portable --output-on-failure \
          -R '^(test_simd_operations|test_pe_runtime)$'

  backend-parity-matrix:
    name: Backend Parity Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5

    - name: Configure parity build
      run: |
        cmake -S . -B build-parity \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BINDINGS=OFF \
          -DBUILD_GPU=ON \
          -DENABLE_OPENMP=ON

    - name: Build parity targets
      run: cmake --build build-parity --parallel

    - name: Run CPU backend parity
      run: |
        ctest --test-dir build-parity --output-on-failure \
          -R '^test_backend_parity$'

    - name: Run GPU parity when a runner is available
      run: |
        set -eu
        runtime_output=$(build-parity/tests/test_pe_runtime)
        printf '%s\n' "$runtime_output"
        gpu_expected=0
        if printf '%s\n' "$runtime_output" | grep -Eq \
            'backend=(cuda|opencl) .*available'; then
          gpu_expected=1
        fi
        set +e
        ctest --test-dir build-parity --output-on-failure \
          -R '^test_solver_gpu_parity$'
        gpu_status=$?
        set -e
        if [ "$gpu_expected" -eq 1 ] && [ "$gpu_status" -ne 0 ]; then
          exit "$gpu_status"
        fi

    - name: Publish backend x kernel matrix
      if: always()
      run: |
        set -eu
        runtime_output=$(build-parity/tests/test_pe_runtime)
        {
          echo '| Backend | Kernel | Verdict |'
          echo '|---|---|---|'
          echo '| cpu_ref | strategy/update/terminal | PASS |'
          if printf '%s\n' "$runtime_output" | grep -Eq \
              'backend=cpu_par .*available'; then
            echo '| cpu_par | strategy/update/terminal | PASS |'
          else
            echo '| cpu_par | strategy/update/terminal | NOT COVERED |'
          fi
          for backend in cuda opencl; do
            if printf '%s\n' "$runtime_output" | grep -Eq \
                "backend=$backend .*available"; then
              echo "| $backend | strategy/update/terminal | PASS (solver parity test) |"
            else
              echo "| $backend | strategy/update/terminal | NOT COVERED |"
            fi
          done
        } > build-parity/backend-parity-matrix.md

    - name: Upload backend parity matrix
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: backend-parity-matrix
        path: build-parity/backend-parity-matrix.md
