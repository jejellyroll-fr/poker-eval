[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "pypoker-eval"
version = "1.3.2"
description = "Fast poker hand evaluation library with Python bindings"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENCE", "LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = []
install.components = ["python"]
cmake.build-type = "Release"
sdist.exclude = [
    ".github/",
    "docs/",
    "notebooks/",
    "scripts/",
    "tests/",
]

[tool.scikit-build.cmake.define]
BUILD_BINDINGS = true
BUILD_C_API = false
BUILD_CSHARP_BINDING = false
BUILD_CXX_BINDING = false
BUILD_CYTHON_BINDING = false
BUILD_DOCUMENTATION = false
BUILD_EXAMPLES = false
BUILD_GPU = false
BUILD_JAVA_BINDING = false
BUILD_PYTHON_BINDING = true
BUILD_SHARED_LIBS = false
BUILD_TESTS = false
# zstd only backs the solver's compressed .pe_sol snapshots. Left on, a wheel
# links whatever libzstd the build machine has: on the macOS runners that is
# Homebrew's, built for macOS 15, which delocate rightly refuses to ship in a
# wheel targeting macOS 11 / 10.9. The Linux image never had it either.
ENABLE_ZSTD = false
# A wheel runs on any CPU of its platform tag, not on the runner that built it:
# -march=native would let the compiler emit e.g. AVX-512 from the CI host and
# crash with an illegal instruction elsewhere. SIMD paths dispatch at runtime.
ENABLE_NATIVE_ARCH = false
